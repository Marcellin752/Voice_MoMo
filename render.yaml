services:
  # Backend Node.js
  - type: web
    name: voice-momo-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voice-momo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voice-momo-redis
          property: connectionString
      - key: NLP_MODULE_URL
        fromService:
          type: web
          name: voice-momo-nlp
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_ENCRYPTION_KEY
        generateValue: true
      - key: USE_MOCK_MODEM
        value: "true"

  # NLP Module (FastAPI)
  - type: web
    name: voice-momo-nlp
    runtime: python
    rootDir: apps/nlp
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: voice-momo-backend
          envVarKey: JWT_SECRET

  # Redis Instance
  - type: keyvalue
    name: voice-momo-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow all"

databases:
  - name: voice-momo-db
    databaseName: mtn_ussd
    user: mtn
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow all"

