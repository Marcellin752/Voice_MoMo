name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Install Mobile dependencies
        working-directory: Mobile
        run: npm ci

      - name: Build React app (production)
        working-directory: Mobile
        env:
          VITE_API_BASE_URL: https://voice-momo-backend.onrender.com
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        working-directory: Mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: Mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: Mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-momo-debug
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
