name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build React app (production)
        working-directory: apps/mobile
        env:
          VITE_API_BASE_URL: https://voice-momo-backend-2qy2.onrender.com
          VITE_VOICE_AI_URL: https://voice-momo.onrender.com
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-momo-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Voice MoMo — Build ${{ github.run_number }}"
          body: |
            APK de test généré automatiquement.
            **Installation** : télécharge `app-debug.apk`, active "Sources inconnues" dans les paramètres Android, puis installe.
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
