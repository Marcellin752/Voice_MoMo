# Fige l’APK démo sous le tag stable `village-2026` (URL du QR / page d’install).
# Déclenchement : push du tag, ou manuel (Actions → Release village APK → Run workflow).
name: Release village APK

on:
  push:
    tags: ['village-2026']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build React app (production)
        working-directory: apps/mobile
        env:
          VITE_API_BASE_URL: https://voice-momo-backend-2qy2.onrender.com
          VITE_VOICE_AI_URL: https://voice-momo.onrender.com
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Capacitor sync
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish / update GitHub Release village-2026
        uses: softprops/action-gh-release@v2
        with:
          tag_name: village-2026
          target_commitish: ${{ github.sha }}
          name: "Voice MoMo — Village de l’Innovation 2026"
          body: |
            APK de démonstration pour le **Village de l’Innovation** (Cotonou, 18–20 novembre 2026).

            **Installer** : ouvrez la page
            [voice-momo-backend…/installer/](https://voice-momo-backend-2qy2.onrender.com/installer/)
            (ou téléchargez `app-debug.apk` ci-dessous), activez les sources inconnues, puis installez.

            URLs figées : backend et NLP Render.
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}