# Déploie docs/installer/ sur GitHub Pages (racine du site = page d’install du QR).
name: Deploy installer page

on:
  push:
    branches: [main]
    paths:
      - 'docs/installer/**'
      - '.github/workflows/deploy-installer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Racine du site + /installer/ → https://marcellin752.github.io/Voice_MoMo/installer/
      - name: Stage site tree
        run: |
          mkdir -p _site/installer
          cp -a docs/installer/. _site/installer/
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>Voice MoMo</title><meta http-equiv="refresh" content="0;url=installer/"><link rel="canonical" href="installer/"><a href="installer/">Installer Voice MoMo</a>' > _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
